<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>
    <style>
        /* Background design */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-size: cover;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            width: 350px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, button {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            color: #333;
        }

        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        label {
            text-align: left;
            font-size: 14px;
            margin-bottom: 5px;
            color: #555;
        }

        #result {
            margin-top: 20px;
        }

        #result p {
            font-size: 18px;
            font-weight: bold;
        }

        .message {
            color: #e74c3c;
        }

        .success {
            color: #2ecc71;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            font-size: 16px;
            color: #3498db;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #888;
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>Student Performance Prediction</h2>

        <!-- Prediction Form -->
        <form method="POST" action="/predict">
            <label for="attendance">Attendance (%)</label>
            <input type="number" id="attendance" name="attendance" step="0.1" required placeholder="Enter attendance">

            <label for="marks_obtained">Marks Obtained</label>
            <input type="number" id="marks_obtained" name="marks_obtained" step="0.1" required placeholder="Enter marks obtained">

            <label for="total_marks">Total Marks</label>
            <input type="number" id="total_marks" name="total_marks" step="0.1" required placeholder="Enter total marks">

            <label for="percentage">Percentage (%)</label>
            <input type="number" id="percentage" name="percentage" step="0.1" required placeholder="Enter percentage">

            <label for="class_rank">Class Rank</label>
            <input type="number" id="class_rank" name="class_rank" required placeholder="Enter class rank">

            <button type="submit">Predict Performance</button>
        </form>

        <!-- Result Display -->
        <div id="result">
            {% if performance %}
                <p class="success">{{ performance }}</p>
            {% endif %}

            {% if message %}
                <p class="message">{{ message }}</p>
            {% endif %}
        </div>

        <a href="/dashboard">Go to Dashboard 📊</a>
    </div>

    <div class="footer">
        &copy; Dveloped By Shivam Shrivastava
    </div>

</body>
</html>
